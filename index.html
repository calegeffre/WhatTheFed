<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WhatTheFed Dashboard</title>
  <style>
    :root {
      --bg: #08111f;
      --panel: #101c2e;
      --panel-border: #203250;
      --text: #eef4ff;
      --muted: #93a3bd;
      --hot: #ff6b6b;
      --warm: #f7b267;
      --balanced: #66c7f4;
      --cool: #7bd389;
      --cold: #4ecdc4;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(circle at top, #13243d, var(--bg) 65%);
      color: var(--text);
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 24px 48px;
    }

    h1, h2, h3, p { margin: 0; }

    .hero,
    .section {
      background: rgba(16, 28, 46, 0.92);
      border: 1px solid var(--panel-border);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.2);
    }

    .hero {
      display: grid;
      gap: 24px;
      margin-bottom: 24px;
    }

    .eyebrow {
      color: #8dc8ff;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .hero-grid {
      display: grid;
      gap: 20px;
    }

    .hero-grid {
      grid-template-columns: 1.2fr 1fr;
      align-items: start;
    }

    .prediction-card {
      padding: 18px;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(141, 200, 255, 0.14), rgba(255, 255, 255, 0.04));
      border: 1px solid rgba(141, 200, 255, 0.2);
      margin-top: 18px;
    }

    .prediction-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-bottom: 10px;
    }

    .pill,
    .source-pill {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 13px;
    }

    .pill {
      background: rgba(247, 178, 103, 0.18);
      color: #ffd6a5;
      border: 1px solid rgba(247, 178, 103, 0.3);
    }

    a.pill,
    a.source-pill {
      text-decoration: none;
      transition: transform 120ms ease, border-color 120ms ease, background 120ms ease;
    }

    a.pill:hover,
    a.source-pill:hover {
      transform: translateY(-1px);
    }

    a.pill:focus-visible,
    a.source-pill:focus-visible {
      outline: 2px solid #8dc8ff;
      outline-offset: 2px;
    }

    .source-list {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .source-pill {
      background: rgba(255, 255, 255, 0.06);
      color: var(--muted);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .heat-map {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .heat-cell {
      border-radius: 18px;
      padding: 16px;
      min-height: 148px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: grid;
      gap: 8px;
      align-content: start;
    }

    .heat-score {
      font-size: 32px;
      font-weight: bold;
    }

    .heat-hot { background: rgba(255, 107, 107, 0.18); }
    .heat-warm { background: rgba(247, 178, 103, 0.16); }
    .heat-balanced { background: rgba(102, 199, 244, 0.16); }
    .heat-cool { background: rgba(123, 211, 137, 0.16); }
    .heat-cold { background: rgba(78, 205, 196, 0.16); }

    .section {
      margin-top: 24px;
    }

    .voter-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 14px;
      text-align: center;
    }

    .avatar {
      width: 52px;
      height: 52px;
      margin: 0 auto 12px;
      position: relative;
    }

    .avatar::before,
    .avatar::after {
      content: "";
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(180deg, #f5d7b0, #d1a980);
    }

    .avatar::before {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      top: 0;
    }

    .avatar::after {
      width: 42px;
      height: 24px;
      border-radius: 18px 18px 10px 10px;
      bottom: 0;
    }

    .vote-tag {
      margin-top: 10px;
      border-radius: 999px;
      padding: 6px 10px;
      display: inline-block;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .vote-raise { background: rgba(255, 107, 107, 0.22); color: #ffd0d0; }
    .vote-hold { background: rgba(102, 199, 244, 0.22); color: #d6f2ff; }
    .vote-hold-dissent { background: rgba(247, 178, 103, 0.22); color: #ffe2bf; }
    .vote-cut { background: rgba(123, 211, 137, 0.22); color: #dff8e5; }

    .note {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
      margin-top: 14px;
    }

    .timeline-scroll {
      max-height: 980px;
      overflow-y: auto;
      display: grid;
      gap: 18px;
      margin-top: 20px;
      padding-right: 8px;
    }

    .timeline-card {
      position: relative;
      padding: 22px 22px 22px 28px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.03);
      overflow: hidden;
    }

    .timeline-card::before {
      content: "";
      position: absolute;
      top: 20px;
      bottom: 20px;
      left: 14px;
      width: 2px;
      background: linear-gradient(180deg, rgba(141, 200, 255, 0.8), rgba(141, 200, 255, 0.18));
    }

    .timeline-card::after {
      content: "";
      position: absolute;
      top: 28px;
      left: 9px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #8dc8ff;
      box-shadow: 0 0 0 6px rgba(141, 200, 255, 0.12);
    }

    .timeline-header {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: space-between;
      align-items: flex-start;
    }

    .timeline-title {
      display: grid;
      gap: 4px;
    }

    .timeline-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }

    .timeline-stats,
    .timeline-breakdown {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .metric-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 13px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text);
    }

    .metric-dot {
      display: inline-block;
      border-radius: 999px;
    }

    .metric-dot {
      width: 10px;
      height: 10px;
    }

    .vote-bar {
      display: flex;
      width: 100%;
      height: 12px;
      margin-top: 14px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .vote-segment {
      height: 100%;
    }

    .timeline-votes-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(120px, 1fr));
      gap: 12px;
      margin-top: 16px;
    }

    .timeline-voter-card {
      padding: 12px;
    }

    .timeline-voter-card h4 {
      margin: 0 0 8px;
      font-size: 13px;
      font-weight: 600;
    }

    .fill-hold,
    .dot-hold {
      background: rgba(102, 199, 244, 0.9);
    }

    .fill-hold-dissent,
    .dot-hold-dissent {
      background: rgba(247, 178, 103, 0.9);
    }

    .fill-raise,
    .dot-raise {
      background: rgba(255, 107, 107, 0.9);
    }

    .fill-cut,
    .dot-cut {
      background: rgba(123, 211, 137, 0.9);
    }

    @media (max-width: 920px) {
      .hero-grid,
      .heat-map {
        grid-template-columns: 1fr;
      }
      .timeline-votes-grid {
        grid-template-columns: repeat(2, minmax(120px, 1fr));
      }
    }

    .year-tabs,
    .viz-tabs {
      display: flex;
      gap: 8px;
      margin: 16px 0;
    }

    .year-tab,
    .viz-tab {
      padding: 8px 20px;
      border-radius: 999px;
      border: 1px solid rgba(141, 200, 255, 0.2);
      background: rgba(255, 255, 255, 0.04);
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 120ms ease, color 120ms ease, border-color 120ms ease;
    }

    .year-tab:hover,
    .viz-tab:hover {
      background: rgba(141, 200, 255, 0.1);
      color: var(--text);
      border-color: rgba(141, 200, 255, 0.35);
    }

    .year-tab.year-tab-active,
    .viz-tab.viz-tab-active {
      background: rgba(141, 200, 255, 0.18);
      color: #8dc8ff;
      border-color: rgba(141, 200, 255, 0.5);
      font-weight: 600;
    }

    .viz-panel { display: none; }
    .viz-panel.viz-panel-active { display: block; }
    .viz-chart {
      width: 100%;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(141, 200, 255, 0.1);
      border-radius: 12px;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.min.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <main class="page">
    <section class="hero">
      <div class="eyebrow">WhatTheFed</div>
      <div class="hero-grid">
        <div>
          <h1>Next Meeting Heat Map</h1>
          <p id="summary" class="note"></p>
          <div class="prediction-card">
            <div class="prediction-row">
              <h2 id="prediction-title"></h2>
              <span id="confidence" class="pill"></span>
            </div>
            <p id="rationale" class="note"></p>
            <div id="sources" class="source-list"></div>
          </div>
        </div>
        <div id="heat-map" class="heat-map"></div>
      </div>
    </section>

    <section class="section">
      <div class="eyebrow">Data Visualization</div>
      <div class="viz-tabs">
        <button class="viz-tab viz-tab-active" data-viz="rate-timeline">Rate Decision Timeline</button>
        <button class="viz-tab" data-viz="knowledge-graph">Signal Knowledge Graph</button>
      </div>
      <div id="viz-panel-rate-timeline" class="viz-panel viz-panel-active">
        <svg id="rate-chart" class="viz-chart" viewBox="0 0 800 260" preserveAspectRatio="xMidYMid meet"></svg>
      </div>
      <div id="viz-panel-knowledge-graph" class="viz-panel">
        <div id="kg-canvas" class="viz-chart" style="height:460px;position:relative;overflow:hidden;"></div>
      </div>
    </section>

    <section class="section">
      <div class="eyebrow">Previous meeting history</div>
      <p class="note">Each card links to the official Fed HTML statement and shows the decision, published tally, dissent context, and the same generic voter icons used in the latest-meeting view.</p>
      <div id="year-tabs" class="year-tabs"></div>
      <div id="meeting-timeline" class="timeline-scroll"></div>
    </section>
  </main>

  <script>
    window.__FOMC_DASHBOARD_DATA__ = window.__FOMC_DASHBOARD_DATA__ || null;
    window.__FOMC_HISTORY_DATA__ = window.__FOMC_HISTORY_DATA__ || null;
    window.__MARKET_DASHBOARD_DATA__ = window.__MARKET_DASHBOARD_DATA__ || null;
  </script>
  <script src="data/fomc_dashboard_data.js"></script>
  <script src="data/fomc_history_data.js"></script>
  <script src="data/market_dashboard_data.js"></script>
  <script>
    const dashboardData = {
      next_meeting_prediction: {
        decision: "raise",
        confidence: 0.9,
        rationale: "fomc_2026_07: hawkish=2, dovish=0; jobs: hawkish=1, dovish=0; cpi: hawkish=1, dovish=0",
      },
      evidence_sources: ["fomc_2026_07", "jobs", "cpi", "gdp"],
      meeting_history: [
        {
          label: "July 2026",
          date: "July 29, 2026",
          decision: "hold",
          official_vote: "9-3",
          url: "https://www.federalreserve.gov/newsevents/pressreleases/monetary20260729a.htm",
          summary:
            "The Committee maintained the target range at 3-1/2 to 3-3/4 percent, citing solid growth, strong productivity and investment, steady labor-market conditions, and still-elevated inflation.",
          dissent_note: "Three dissenters preferred a 25 bp rate increase at this meeting.",
          votes: ["hold", "hold", "hold", "hold", "hold", "hold", "hold", "hold", "hold", "raise", "raise", "raise"],
        },
        {
          label: "June 2026",
          date: "June 17, 2026",
          decision: "hold",
          official_vote: "12-0",
          url: "https://www.federalreserve.gov/newsevents/pressreleases/monetary20260617a.htm",
          summary:
            "The Committee maintained the target range at 3-1/2 to 3-3/4 percent while citing solid activity, strong investment, and inflation pressure tied partly to energy-related supply shocks.",
          dissent_note: "The official statement was approved unanimously.",
          votes: ["hold", "hold", "hold", "hold", "hold", "hold", "hold", "hold", "hold", "hold", "hold", "hold"],
        },
        {
          label: "April 2026",
          date: "April 29, 2026",
          decision: "hold",
          official_vote: "8-4",
          url: "https://www.federalreserve.gov/newsevents/pressreleases/monetary20260429a.htm",
          summary:
            "The Committee held rates steady amid elevated inflation and geopolitical uncertainty, keeping the 3-1/2 to 3-3/4 percent target range in place.",
          dissent_note:
            "One dissenter preferred a 25 bp cut, while three others supported the rate hold but opposed including easing-bias language in the statement.",
          votes: [
            "hold",
            "hold",
            "hold",
            "hold",
            "hold",
            "hold",
            "hold",
            "hold",
            "hold-dissent",
            "hold-dissent",
            "hold-dissent",
            "cut",
          ],
        },
        {
          label: "March 2026",
          date: "March 18, 2026",
          decision: "hold",
          official_vote: "11-1",
          url: "https://www.federalreserve.gov/newsevents/pressreleases/monetary20260318a.htm",
          summary:
            "The Committee maintained the target range at 3-1/2 to 3-3/4 percent and stressed elevated uncertainty alongside still-elevated inflation.",
          dissent_note: "One dissenter preferred a 25 bp cut at the meeting.",
          votes: ["hold", "hold", "hold", "hold", "hold", "hold", "hold", "hold", "hold", "hold", "hold", "cut"],
        },
        {
          label: "January 2026",
          date: "January 28, 2026",
          decision: "hold",
          official_vote: "10-2",
          url: "https://www.federalreserve.gov/newsevents/pressreleases/monetary20260128a.htm",
          summary:
            "The Committee kept rates unchanged at 3-1/2 to 3-3/4 percent, noting solid activity, labor-market stabilization, and still-elevated inflation.",
          dissent_note: "Two dissenters preferred a 25 bp cut at the meeting.",
          votes: ["hold", "hold", "hold", "hold", "hold", "hold", "hold", "hold", "hold", "hold", "cut", "cut"],
        },
      ],
      dashboard: {
        next_meeting_heat_map: [
          { label: "Inflation Pressure", score: 5, tone: "hot", sources: ["fomc_2026_07", "cpi"] },
          { label: "Labor Strength", score: 5, tone: "hot", sources: ["fomc_2026_07", "jobs"] },
          { label: "Growth Momentum", score: 2, tone: "cool", sources: ["jobs", "gdp"] },
          { label: "Policy Bias", score: 4, tone: "warm", sources: ["fomc_2026_07", "cpi", "jobs"] },
        ],
      },
    };

    const fomcOverlay = window.__FOMC_DASHBOARD_DATA__;
    const marketOverlay = window.__MARKET_DASHBOARD_DATA__;
    const normalizeTriplet = (values) => {
      const parsed = {
        raise: Number(values?.raise || 0),
        hold: Number(values?.hold || 0),
        cut: Number(values?.cut || 0),
      };
      const total = parsed.raise + parsed.hold + parsed.cut;
      if (total <= 0) {
        return { raise: 0, hold: 0, cut: 0 };
      }
      return {
        raise: parsed.raise / total,
        hold: parsed.hold / total,
        cut: parsed.cut / total,
      };
    };
    const formatPct = (value) => `${Math.round((value || 0) * 100)}%`;
    const scoreFromProbability = (value) => Math.max(1, Math.min(5, Math.round((value || 0) * 5)));
    const toneFromScore = (score) => {
      if (score >= 5) return "hot";
      if (score === 4) return "warm";
      if (score === 3) return "balanced";
      if (score === 2) return "cool";
      return "cold";
    };

    const marketPrediction = (() => {
      if (!marketOverlay || !marketOverlay.blended_probabilities) return null;
      const blended = normalizeTriplet(marketOverlay.blended_probabilities);
      const ordered = Object.entries(blended).sort((a, b) => b[1] - a[1]);
      const [decision, confidence] = ordered[0];
      const providerNotes = Object.entries(marketOverlay.providers || {}).map(([provider, payload]) => {
        const providerBlend = normalizeTriplet(payload.probabilities || {});
        return `${provider}: R ${formatPct(providerBlend.raise)}, H ${formatPct(providerBlend.hold)}, C ${formatPct(providerBlend.cut)}`;
      });
      return {
        decision,
        confidence,
        rationale:
          `Market blend (${marketOverlay.target_meeting}): ` +
          `R ${formatPct(blended.raise)}, H ${formatPct(blended.hold)}, C ${formatPct(blended.cut)}.` +
          (providerNotes.length ? ` Providers: ${providerNotes.join("; ")}` : ""),
      };
    })();

    const marketHeatCards = (() => {
      if (!marketOverlay || !marketOverlay.blended_probabilities) return [];
      const blended = normalizeTriplet(marketOverlay.blended_probabilities);
      const labels = [
        { key: "raise", title: "Market Raise Odds" },
        { key: "hold", title: "Market Hold Odds" },
        { key: "cut", title: "Market Cut Odds" },
      ];
      const providerNotes = Object.entries(marketOverlay.providers || {}).map(([provider, payload]) => {
        const providerBlend = normalizeTriplet(payload.probabilities || {});
        return { provider, probs: providerBlend };
      });
      return labels.map((item) => {
        const score = scoreFromProbability(blended[item.key]);
        return {
          label: item.title,
          score,
          tone: toneFromScore(score),
          sources: [
            `target ${marketOverlay.target_meeting}`,
            ...providerNotes.map((note) => `${note.provider}: ${formatPct(note.probs[item.key])}`),
          ],
        };
      });
    })();

    const fomcHeatCards = (() => {
      if (!fomcOverlay || !Array.isArray(fomcOverlay.signals) || !fomcOverlay.signals.length) {
        return dashboardData.dashboard.next_meeting_heat_map;
      }
      return fomcOverlay.signals.map((signal) => {
        const score = Math.max(1, Math.min(5, Number(signal?.score || 3)));
        return {
          label: String(signal?.label || "FOMC Signal"),
          score,
          tone: String(signal?.tone || toneFromScore(score)),
          sources: Array.isArray(signal?.sources) ? signal.sources.map((source) => String(source)) : [],
        };
      });
    })();

    const activePrediction = marketPrediction || dashboardData.next_meeting_prediction;
    const combinedHeatMap = [...fomcHeatCards, ...marketHeatCards];

    const nextMeetingDate = marketOverlay?.target_meeting || fomcOverlay?.meeting_date || "N/A";
    document.getElementById("summary").textContent =
      `Mix of parsed FOMC statements, daily market snapshots. Next FOMC Meeting: ${nextMeetingDate}`;
    document.getElementById("prediction-title").textContent =
      `Predicted next move: ${String(activePrediction.decision).toUpperCase()}`;
    document.getElementById("confidence").textContent =
      `${Math.round(Number(activePrediction.confidence || 0) * 100)}% confidence`;
    document.getElementById("rationale").textContent = activePrediction.rationale;

    const sources = document.getElementById("sources");
    const sourceItems = new Set(dashboardData.evidence_sources);
    if (fomcOverlay && fomcOverlay.meeting_date) {
      sourceItems.add(`fomc:${fomcOverlay.meeting_date}`);
    }
    if (marketOverlay) {
      sourceItems.add(`market:${marketOverlay.target_meeting}`);
      Object.keys(marketOverlay.providers || {}).forEach((provider) => sourceItems.add(`market:${provider}`));
    }
    [...sourceItems].forEach((source) => {
      const pill = document.createElement("span");
      pill.className = "source-pill";
      pill.textContent = source;
      sources.appendChild(pill);
    });

    const heatMap = document.getElementById("heat-map");
    combinedHeatMap.forEach((item) => {
      const card = document.createElement("article");
      card.className = `heat-cell heat-${item.tone}`;
      card.innerHTML = `
        <div class="eyebrow">${item.label}</div>
        <div class="heat-score">${item.score}/5</div>
        <div>${item.tone}</div>
        <div class="source-list">${item.sources.map((source) => `<span class="source-pill">${source}</span>`).join("")}</div>
      `;
      heatMap.appendChild(card);
    });

    const voteConfig = {
      hold: { label: "Hold", fillClass: "fill-hold", dotClass: "dot-hold" },
      "hold-dissent": {
        label: "Hold dissent",
        fillClass: "fill-hold-dissent",
        dotClass: "dot-hold-dissent",
      },
      raise: { label: "Raise", fillClass: "fill-raise", dotClass: "dot-raise" },
      cut: { label: "Cut", fillClass: "fill-cut", dotClass: "dot-cut" },
    };
    const voteOrder = ["hold", "hold-dissent", "raise", "cut"];

    const meetingTimeline = document.getElementById("meeting-timeline");
    const yearTabsEl = document.getElementById("year-tabs");
    const historyOverlay = window.__FOMC_HISTORY_DATA__;

    // 2026 uses hardcoded data (voter grids + dissent notes); prior years come from parsed DB
    const allMeetingsByYear = {};
    allMeetingsByYear["2026"] = { source: "hardcoded", meetings: dashboardData.meeting_history };
    if (historyOverlay) {
      Object.entries(historyOverlay).forEach(([year, meetings]) => {
        if (year !== "2026") allMeetingsByYear[year] = { source: "db", meetings };
      });
    }

    const availableYears = Object.keys(allMeetingsByYear).sort((a, b) => Number(b) - Number(a));
    let activeYear = availableYears[0];

    function renderDbCard(meeting) {
      const card = document.createElement("article");
      card.className = "timeline-card";
      const tallyChip = meeting.vote_tally
        ? `<span class="source-pill">Official vote: ${meeting.vote_tally}</span>`
        : "";
      card.innerHTML = `
        <div class="timeline-header">
          <div class="timeline-title">
            <div class="eyebrow">${meeting.meeting_date}</div>
            <h3>${meeting.label}</h3>
          </div>
          <div class="timeline-links">
            <a class="pill" href="${meeting.source_url}" target="_blank" rel="noopener noreferrer">FOMC Statement</a>
          </div>
        </div>
        <div class="timeline-stats">
          <span class="pill">Decision: ${String(meeting.decision).toUpperCase()}</span>
          ${tallyChip}
        </div>
        <p class="note">${meeting.summary || ""}</p>
      `;
      return card;
    }

    function renderFullCard(meeting) {
      const counts = voteOrder
        .map((vote) => ({
          vote,
          count: meeting.votes.filter((item) => item === vote).length,
        }))
        .filter((item) => item.count > 0);

      const card = document.createElement("article");
      card.className = "timeline-card";
      card.innerHTML = `
        <div class="timeline-header">
          <div class="timeline-title">
            <div class="eyebrow">${meeting.date}</div>
            <h3>${meeting.label}</h3>
          </div>
          <div class="timeline-links">
            <a class="pill" href="${meeting.url}" target="_blank" rel="noopener noreferrer">FOMC Statement</a>
          </div>
        </div>
        <div class="timeline-stats">
          <span class="pill">Decision: ${meeting.decision.toUpperCase()}</span>
          <span class="source-pill">Official vote: ${meeting.official_vote}</span>
        </div>
        <p class="note">${meeting.summary}</p>
        <p class="note">${meeting.dissent_note}</p>
        <div class="timeline-breakdown">
          ${counts
            .map(
              (item) => `
                <span class="metric-chip">
                  <span class="metric-dot ${voteConfig[item.vote].dotClass}"></span>
                  ${voteConfig[item.vote].label}: ${item.count}
                </span>
              `
            )
            .join("")}
        </div>
        <div class="vote-bar">
          ${counts
            .map(
              (item) => `
                <span
                  class="vote-segment ${voteConfig[item.vote].fillClass}"
                  style="width: ${(item.count / meeting.votes.length) * 100}%"
                ></span>
              `
            )
            .join("")}
        </div>
        <div class="timeline-votes-grid">
          ${meeting.votes
            .map(
              (vote, index) => `
                <article class="voter-card timeline-voter-card" title="${voteConfig[vote].label}" aria-label="${voteConfig[vote].label}">
                  <div class="avatar" aria-hidden="true"></div>
                  <h4>Member ${(index + 1).toString().padStart(2, "0")}</h4>
                  <div class="vote-tag vote-${vote}">${voteConfig[vote].label}</div>
                </article>
              `
            )
            .join("")}
        </div>
      `;
      return card;
    }

    function renderTimeline() {
      meetingTimeline.innerHTML = "";
      const yearData = allMeetingsByYear[activeYear];
      if (!yearData) return;
      yearData.meetings.forEach((meeting) => {
        const card = yearData.source === "hardcoded" ? renderFullCard(meeting) : renderDbCard(meeting);
        meetingTimeline.appendChild(card);
      });
    }

    function renderTabs() {
      yearTabsEl.innerHTML = availableYears
        .map(
          (year) =>
            `<button class="year-tab${year === activeYear ? " year-tab-active" : ""}" data-year="${year}">${year}</button>`
        )
        .join("");
      yearTabsEl.querySelectorAll(".year-tab").forEach((btn) => {
        btn.addEventListener("click", () => {
          activeYear = btn.dataset.year;
          renderTabs();
          renderTimeline();
        });
      });
    }

    renderTabs();
    renderTimeline();

    // ── Data Visualization ──────────────────────────────────────────
    const VIZ_NS = "http://www.w3.org/2000/svg";

    function svgEl(tag, attrs, text) {
      const e = document.createElementNS(VIZ_NS, tag);
      Object.entries(attrs).forEach(([k, v]) => e.setAttribute(k, String(v)));
      if (text !== undefined) e.textContent = text;
      return e;
    }

    // Rate history: [date, lower-bound %, upper-bound %, decision]
    const RATE_HISTORY = [
      ["2023-09-20", 5.25, 5.50, "hold"],
      ["2023-11-01", 5.25, 5.50, "hold"],
      ["2023-12-13", 5.25, 5.50, "hold"],
      ["2024-01-31", 5.25, 5.50, "hold"],
      ["2024-03-20", 5.25, 5.50, "hold"],
      ["2024-05-01", 5.25, 5.50, "hold"],
      ["2024-06-12", 5.25, 5.50, "hold"],
      ["2024-07-31", 5.25, 5.50, "hold"],
      ["2024-09-18", 4.75, 5.00, "cut"],
      ["2024-11-07", 4.50, 4.75, "cut"],
      ["2024-12-18", 4.25, 4.50, "cut"],
      ["2025-01-29", 4.25, 4.50, "hold"],
      ["2025-03-19", 4.25, 4.50, "hold"],
      ["2025-05-07", 4.25, 4.50, "hold"],
      ["2025-06-18", 4.25, 4.50, "hold"],
      ["2025-07-30", 4.25, 4.50, "hold"],
      ["2025-09-17", 4.00, 4.25, "cut"],
      ["2025-10-29", 3.75, 4.00, "cut"],
      ["2025-12-10", 3.50, 3.75, "cut"],
      ["2026-01-28", 3.50, 3.75, "hold"],
      ["2026-03-18", 3.50, 3.75, "hold"],
      ["2026-04-29", 3.50, 3.75, "hold"],
      ["2026-06-17", 3.50, 3.75, "hold"],
      ["2026-07-29", 3.50, 3.75, "hold"],
    ];

    function drawRateTimeline() {
      const svg = document.getElementById("rate-chart");
      if (!svg) return;
      svg.innerHTML = "";

      const VW = 800, VH = 260;
      const P = { t: 22, r: 24, b: 50, l: 54 };
      const CW = VW - P.l - P.r, CH = VH - P.t - P.b;
      const minT = new Date(RATE_HISTORY[0][0]).getTime();
      const maxT = new Date("2026-10-01").getTime();
      const minR = 3.0, maxR = 5.75;

      const xS = (d) => P.l + ((new Date(d).getTime() - minT) / (maxT - minT)) * CW;
      const yS = (r) => P.t + ((maxR - r) / (maxR - minR)) * CH;

      // Horizontal grid lines + Y-axis labels
      [3.5, 4.0, 4.5, 5.0, 5.5].forEach((r) => {
        svg.appendChild(svgEl("line", { x1: P.l, y1: yS(r), x2: P.l + CW, y2: yS(r), stroke: "rgba(141,200,255,0.08)", "stroke-width": 1 }));
        svg.appendChild(svgEl("text", { x: P.l - 6, y: yS(r) + 4, "text-anchor": "end", fill: "rgba(200,210,225,0.45)", "font-size": 10 }, r.toFixed(2) + "%"));
      });

      // Build upper step path then polygon with lower path reversed (rate band fill)
      const xEnd = xS("2026-10-01");
      let upper = `M ${xS(RATE_HISTORY[0][0])},${yS(RATE_HISTORY[0][2])}`;
      for (let i = 1; i < RATE_HISTORY.length; i++) upper += ` H ${xS(RATE_HISTORY[i][0])} V ${yS(RATE_HISTORY[i][2])}`;
      upper += ` H ${xEnd}`;

      let lowerRev = ` V ${yS(RATE_HISTORY.at(-1)[1])} H ${xS(RATE_HISTORY.at(-1)[0])}`;
      for (let i = RATE_HISTORY.length - 2; i >= 0; i--) lowerRev += ` V ${yS(RATE_HISTORY[i][1])} H ${xS(RATE_HISTORY[i][0])}`;
      lowerRev += " Z";

      svg.appendChild(svgEl("path", { d: upper + lowerRev, fill: "rgba(141,200,255,0.09)", stroke: "none" }));
      svg.appendChild(svgEl("path", { d: upper, fill: "none", stroke: "#8dc8ff", "stroke-width": 2 }));

      let lower = `M ${xS(RATE_HISTORY[0][0])},${yS(RATE_HISTORY[0][1])}`;
      for (let i = 1; i < RATE_HISTORY.length; i++) lower += ` H ${xS(RATE_HISTORY[i][0])} V ${yS(RATE_HISTORY[i][1])}`;
      lower += ` H ${xEnd}`;
      svg.appendChild(svgEl("path", { d: lower, fill: "none", stroke: "rgba(141,200,255,0.35)", "stroke-width": 1.5, "stroke-dasharray": "3 3" }));

      // Decision dots
      const DOT_COLOR = { hold: "#8b949e", cut: "#58a6ff", raise: "#ff7b72" };
      RATE_HISTORY.forEach(([d, , hi, dec]) => {
        svg.appendChild(svgEl("circle", { cx: xS(d), cy: yS(hi), r: 4.5, fill: DOT_COLOR[dec] || "#8dc8ff", stroke: "#0d1117", "stroke-width": 1.5 }));
      });

      // Year divider lines + labels
      ["2024", "2025", "2026"].forEach((y) => {
        const xPos = xS(y + "-01-01");
        svg.appendChild(svgEl("line", { x1: xPos, y1: P.t, x2: xPos, y2: P.t + CH, stroke: "rgba(141,200,255,0.1)", "stroke-width": 1, "stroke-dasharray": "4 4" }));
        svg.appendChild(svgEl("text", { x: xPos, y: P.t + CH + 16, "text-anchor": "middle", fill: "rgba(200,210,225,0.5)", "font-size": 11 }, y));
      });

      // Chart border + legend
      svg.appendChild(svgEl("rect", { x: P.l, y: P.t, width: CW, height: CH, fill: "none", stroke: "rgba(141,200,255,0.12)", "stroke-width": 1 }));
      [["#8b949e", "Hold"], ["#58a6ff", "Cut"], ["#ff7b72", "Raise"]].forEach(([color, label], i) => {
        const lx = P.l + i * 72, ly = P.t + CH + 40;
        svg.appendChild(svgEl("circle", { cx: lx + 5, cy: ly - 3, r: 4, fill: color }));
        svg.appendChild(svgEl("text", { x: lx + 13, y: ly, fill: "rgba(200,210,225,0.5)", "font-size": 10 }, label));
      });
      svg.appendChild(svgEl("text", { x: -(P.t + CH / 2), y: 13, transform: "rotate(-90)", "text-anchor": "middle", fill: "rgba(200,210,225,0.35)", "font-size": 10 }, "Fed Funds Rate"));
    }

    // Stub — real implementation provided by the Three.js module below
    function drawKnowledgeGraph() {
      if (typeof window._kgInit === "function") window._kgInit();
    }

    function initVizTabs() {
      const tabBtns = document.querySelectorAll(".viz-tab");
      tabBtns.forEach((btn) => {
        btn.addEventListener("click", () => {
          tabBtns.forEach((b) => b.classList.remove("viz-tab-active"));
          document.querySelectorAll(".viz-panel").forEach((p) => p.classList.remove("viz-panel-active"));
          btn.classList.add("viz-tab-active");
          document.getElementById("viz-panel-" + btn.dataset.viz).classList.add("viz-panel-active");
          if (btn.dataset.viz === "rate-timeline") drawRateTimeline();
          else if (btn.dataset.viz === "knowledge-graph") drawKnowledgeGraph();
        });
      });
      drawRateTimeline();
    }

    initVizTabs();
  </script>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { CSS2DRenderer, CSS2DObject } from "three/addons/renderers/CSS2DRenderer.js";

    (function () {
      const TONE_HEX = { hot: 0xff7b72, warm: 0xffa657, balanced: 0x8dc8ff, cool: 0x79c0ff, cold: 0x58a6ff };
      let state = null;

      function dispose() {
        if (!state) return;
        cancelAnimationFrame(state.animId);
        state.controls.dispose();
        state.renderer.dispose();
        if (state.ro) state.ro.disconnect();
        const c = document.getElementById("kg-canvas");
        if (c) c.innerHTML = "";
        state = null;
      }

      function makeNode(scene, x, y, z, hexColor, radius, label, sublabel) {
        const group = new THREE.Group();
        group.position.set(x, y, z);
        scene.add(group);

        const mat = new THREE.MeshLambertMaterial({
          color: hexColor, transparent: true, opacity: 0.88,
          emissive: hexColor, emissiveIntensity: 0.07,
        });
        group.add(new THREE.Mesh(new THREE.SphereGeometry(radius, 32, 16), mat));

        group.add(new THREE.Mesh(
          new THREE.SphereGeometry(radius * 1.45, 10, 5),
          new THREE.MeshBasicMaterial({ color: hexColor, transparent: true, opacity: 0.07, wireframe: true }),
        ));

        const lDiv = document.createElement("div");
        lDiv.style.cssText = `font-size:11px;font-weight:600;color:#ccd6f6;padding:2px 8px;
          background:rgba(8,17,31,0.78);border-radius:4px;white-space:nowrap;
          font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;text-align:center;`;
        lDiv.textContent = label;
        const lObj = new CSS2DObject(lDiv);
        lObj.position.set(0, radius + 0.28, 0);
        group.add(lObj);

        if (sublabel) {
          const sDiv = document.createElement("div");
          sDiv.style.cssText = `font-size:9px;font-weight:500;color:#${hexColor.toString(16).padStart(6,"0")};
            padding:1px 5px;background:rgba(8,17,31,0.65);border-radius:3px;white-space:nowrap;
            font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;text-align:center;margin-top:1px;`;
          sDiv.textContent = sublabel;
          const sObj = new CSS2DObject(sDiv);
          sObj.position.set(0, radius + 0.68, 0);
          group.add(sObj);
        }
        return group;
      }

      function addEdge(scene, from, to, hexColor, opacity) {
        scene.add(new THREE.Line(
          new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(...from), new THREE.Vector3(...to)]),
          new THREE.LineBasicMaterial({ color: hexColor, transparent: true, opacity: opacity ?? 0.25 }),
        ));
      }

      function buildGraph(scene) {
        const fomcData = window.__FOMC_DASHBOARD_DATA__;
        const mktData  = window.__MARKET_DASHBOARD_DATA__;

        const signals = fomcData?.signals ?? [
          { label: "Inflation Pressure", score: 5, tone: "hot",      mentions: 4 },
          { label: "Labor Strength",     score: 3, tone: "balanced", mentions: 3 },
          { label: "Growth Momentum",    score: 4, tone: "warm",     mentions: 4 },
          { label: "Policy Bias",        score: 5, tone: "hot",      mentions: 6 },
        ];
        const meetingLabel = fomcData?.meeting_label ?? "FOMC Statement";
        const decision     = fomcData?.decision?.toUpperCase() ?? "HOLD";
        const voteTally    = fomcData?.vote_tally ?? "";
        const decisionStr  = voteTally ? `${decision}  ${voteTally}` : decision;

        // ── FOMC hub ─────────────────────────────────────────────
        const HUB_Y = 1.0;
        makeNode(scene, 0, HUB_Y, 0, 0x8dc8ff, 0.56, meetingLabel, decisionStr);

        // ── Signal ring ──────────────────────────────────────────
        const SIG_R = 3.4;
        signals.forEach((sig, i) => {
          const angle = (i / signals.length) * Math.PI * 2 - Math.PI / 2;
          const sx = Math.cos(angle) * SIG_R, sz = Math.sin(angle) * SIG_R;
          const color = TONE_HEX[sig.tone] ?? 0x8dc8ff;
          const r = 0.22 + (sig.score / 5) * 0.26;
          makeNode(scene, sx, HUB_Y, sz, color, r, sig.label, `${sig.mentions}×  ·  ${sig.score}/5`);
          addEdge(scene, [0, HUB_Y, 0], [sx, HUB_Y, sz], color, 0.22);
        });

        // ── Market hub ───────────────────────────────────────────
        const MKT_Y = -2.2;
        const targetLabel = mktData?.target_meeting
          ? `Sep ${mktData.target_meeting.slice(0, 4)}`
          : "Sep 2026";
        makeNode(scene, 0, MKT_Y, 0, 0x79c0ff, 0.4, "Markets", targetLabel);

        // Spine connecting FOMC to Market hub
        addEdge(scene, [0, HUB_Y, 0], [0, MKT_Y, 0], 0x4a5568, 0.35);

        // ── Market outcome ring ───────────────────────────────────
        if (mktData?.blended_probabilities) {
          const bp  = mktData.blended_probabilities;
          const tot = (bp.raise ?? 0) + (bp.hold ?? 0) + (bp.cut ?? 0);
          const norm = (v) => (tot > 0 ? v / tot : 0);
          [
            { key: "raise", label: "Raise", color: 0xff7b72 },
            { key: "hold",  label: "Hold",  color: 0x8dc8ff },
            { key: "cut",   label: "Cut",   color: 0x58a6ff },
          ].forEach(({ key, label, color }, i) => {
            const pct   = norm(bp[key] ?? 0);
            const angle = (i / 3) * Math.PI * 2 - Math.PI / 2;
            const mx = Math.cos(angle) * 2.2, mz = Math.sin(angle) * 2.2;
            const r  = 0.14 + pct * 0.52;
            makeNode(scene, mx, MKT_Y, mz, color, r, label, `${Math.round(pct * 100)}%`);
            addEdge(scene, [0, MKT_Y, 0], [mx, MKT_Y, mz], color, 0.22);
          });
        }

        // ── Reference grid ────────────────────────────────────────
        const grid = new THREE.GridHelper(12, 12, 0x203250, 0x121f30);
        grid.position.y = -3.3;
        scene.add(grid);
      }

      function init() {
        const container = document.getElementById("kg-canvas");
        if (!container) return;
        dispose();

        const W = container.clientWidth  || 700;
        const H = container.clientHeight || 460;

        const scene    = new THREE.Scene();
        scene.background = new THREE.Color(0x08111f);
        scene.fog        = new THREE.FogExp2(0x08111f, 0.052);

        const camera = new THREE.PerspectiveCamera(52, W / H, 0.1, 100);
        camera.position.set(0, 3.5, 10);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(W, H);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(W, H);
        labelRenderer.domElement.style.cssText = "position:absolute;top:0;left:0;pointer-events:none;";
        container.appendChild(labelRenderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        const dir = new THREE.DirectionalLight(0xffffff, 0.9);
        dir.position.set(5, 8, 5);
        scene.add(dir);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping   = true;
        controls.dampingFactor   = 0.06;
        controls.autoRotate      = true;
        controls.autoRotateSpeed = 0.5;
        controls.minDistance     = 4;
        controls.maxDistance     = 22;

        buildGraph(scene);

        let animId;
        function animate() {
          animId = requestAnimationFrame(animate);
          controls.update();
          renderer.render(scene, camera);
          labelRenderer.render(scene, camera);
        }
        animate();

        // Keep canvas sized to container on resize
        const ro = new ResizeObserver(() => {
          const nW = container.clientWidth;
          const nH = container.clientHeight || 460;
          renderer.setSize(nW, nH);
          labelRenderer.setSize(nW, nH);
          camera.aspect = nW / nH;
          camera.updateProjectionMatrix();
        });
        ro.observe(container);

        state = { renderer, labelRenderer, scene, camera, controls, animId, ro };
      }

      window._kgInit = init;
    })();
  </script>
