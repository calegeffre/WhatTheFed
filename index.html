<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WhatTheFed Dashboard</title>
  <style>
    :root {
      --bg: #08111f;
      --panel: #101c2e;
      --panel-border: #203250;
      --text: #eef4ff;
      --muted: #93a3bd;
      --hot: #ff6b6b;
      --warm: #f7b267;
      --balanced: #66c7f4;
      --cool: #7bd389;
      --cold: #4ecdc4;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(circle at top, #13243d, var(--bg) 65%);
      color: var(--text);
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 24px 48px;
    }

    h1, h2, h3, p { margin: 0; }

    .hero,
    .section {
      background: rgba(16, 28, 46, 0.92);
      border: 1px solid var(--panel-border);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.2);
    }

    .hero {
      display: grid;
      gap: 24px;
      margin-bottom: 24px;
    }

    .eyebrow {
      color: #8dc8ff;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .hero-grid {
      display: grid;
      gap: 20px;
    }

    .hero-grid {
      grid-template-columns: 1.2fr 1fr;
      align-items: start;
    }

    .prediction-card {
      padding: 18px;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(141, 200, 255, 0.14), rgba(255, 255, 255, 0.04));
      border: 1px solid rgba(141, 200, 255, 0.2);
      margin-top: 18px;
    }

    .prediction-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-bottom: 10px;
    }

    .pill,
    .source-pill {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 13px;
    }

    .pill {
      background: rgba(247, 178, 103, 0.18);
      color: #ffd6a5;
      border: 1px solid rgba(247, 178, 103, 0.3);
    }

    a.pill,
    a.source-pill {
      text-decoration: none;
      transition: transform 120ms ease, border-color 120ms ease, background 120ms ease;
    }

    a.pill:hover,
    a.source-pill:hover {
      transform: translateY(-1px);
    }

    a.pill:focus-visible,
    a.source-pill:focus-visible {
      outline: 2px solid #8dc8ff;
      outline-offset: 2px;
    }

    .source-list {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .source-pill {
      background: rgba(255, 255, 255, 0.06);
      color: var(--muted);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .heat-map {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .heat-cell {
      border-radius: 18px;
      padding: 16px;
      min-height: 148px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: grid;
      gap: 8px;
      align-content: start;
    }

    .heat-score {
      font-size: 32px;
      font-weight: bold;
    }

    .heat-hot { background: rgba(255, 107, 107, 0.18); }
    .heat-warm { background: rgba(247, 178, 103, 0.16); }
    .heat-balanced { background: rgba(102, 199, 244, 0.16); }
    .heat-cool { background: rgba(123, 211, 137, 0.16); }
    .heat-cold { background: rgba(78, 205, 196, 0.16); }

    .section {
      margin-top: 24px;
    }

    .voter-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 14px;
      text-align: center;
    }

    .avatar {
      width: 52px;
      height: 52px;
      margin: 0 auto 12px;
      position: relative;
    }

    .avatar::before,
    .avatar::after {
      content: "";
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(180deg, #f5d7b0, #d1a980);
    }

    .avatar::before {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      top: 0;
    }

    .avatar::after {
      width: 42px;
      height: 24px;
      border-radius: 18px 18px 10px 10px;
      bottom: 0;
    }

    .vote-tag {
      margin-top: 10px;
      border-radius: 999px;
      padding: 6px 10px;
      display: inline-block;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .vote-raise { background: rgba(255, 107, 107, 0.22); color: #ffd0d0; }
    .vote-hold { background: rgba(102, 199, 244, 0.22); color: #d6f2ff; }
    .vote-hold-dissent { background: rgba(247, 178, 103, 0.22); color: #ffe2bf; }
    .vote-cut { background: rgba(123, 211, 137, 0.22); color: #dff8e5; }

    .note {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
      margin-top: 14px;
    }

    .timeline-scroll {
      max-height: 980px;
      overflow-y: auto;
      display: grid;
      gap: 18px;
      margin-top: 20px;
      padding-right: 8px;
    }

    .timeline-card {
      position: relative;
      padding: 22px 22px 22px 28px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.03);
      overflow: hidden;
    }

    .timeline-card::before {
      content: "";
      position: absolute;
      top: 20px;
      bottom: 20px;
      left: 14px;
      width: 2px;
      background: linear-gradient(180deg, rgba(141, 200, 255, 0.8), rgba(141, 200, 255, 0.18));
    }

    .timeline-card::after {
      content: "";
      position: absolute;
      top: 28px;
      left: 9px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #8dc8ff;
      box-shadow: 0 0 0 6px rgba(141, 200, 255, 0.12);
    }

    .timeline-header {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: space-between;
      align-items: flex-start;
    }

    .timeline-title {
      display: grid;
      gap: 4px;
    }

    .timeline-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }

    .timeline-stats,
    .timeline-breakdown {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .metric-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 13px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text);
    }

    .metric-dot {
      display: inline-block;
      border-radius: 999px;
    }

    .metric-dot {
      width: 10px;
      height: 10px;
    }

    .vote-bar {
      display: flex;
      width: 100%;
      height: 12px;
      margin-top: 14px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .vote-segment {
      height: 100%;
    }

    .timeline-votes-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(120px, 1fr));
      gap: 12px;
      margin-top: 16px;
    }

    .timeline-voter-card {
      padding: 12px;
    }

    .timeline-voter-card h4 {
      margin: 0 0 8px;
      font-size: 13px;
      font-weight: 600;
    }

    .fill-hold,
    .dot-hold {
      background: rgba(102, 199, 244, 0.9);
    }

    .fill-hold-dissent,
    .dot-hold-dissent {
      background: rgba(247, 178, 103, 0.9);
    }

    .fill-raise,
    .dot-raise {
      background: rgba(255, 107, 107, 0.9);
    }

    .fill-cut,
    .dot-cut {
      background: rgba(123, 211, 137, 0.9);
    }

    @media (max-width: 920px) {
      .hero-grid,
      .heat-map {
        grid-template-columns: 1fr;
      }
      .timeline-votes-grid {
        grid-template-columns: repeat(2, minmax(120px, 1fr));
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <div class="eyebrow">WhatTheFed</div>
      <div class="hero-grid">
        <div>
          <h1>Next Meeting Heat Map</h1>
          <p id="summary" class="note"></p>
          <div class="prediction-card">
            <div class="prediction-row">
              <h2 id="prediction-title"></h2>
              <span id="confidence" class="pill"></span>
            </div>
            <p id="rationale" class="note"></p>
            <div id="sources" class="source-list"></div>
          </div>
        </div>
        <div id="heat-map" class="heat-map"></div>
      </div>
    </section>

    <section class="section">
      <div class="eyebrow">Previous meeting history</div>
      <p class="note">Each card links to the official Fed HTML statement and shows the decision, published tally, dissent context, and the same generic voter icons used in the latest-meeting view.</p>
      <div id="meeting-timeline" class="timeline-scroll"></div>
    </section>
  </main>

  <script>
    window.__FOMC_DASHBOARD_DATA__ = window.__FOMC_DASHBOARD_DATA__ || null;
    window.__MARKET_DASHBOARD_DATA__ = window.__MARKET_DASHBOARD_DATA__ || null;
  </script>
  <script src="data/fomc_dashboard_data.js"></script>
  <script src="data/market_dashboard_data.js"></script>
  <script>
    const dashboardData = {
      next_meeting_prediction: {
        decision: "raise",
        confidence: 0.9,
        rationale: "fomc_2026_06: hawkish=2, dovish=0; jobs: hawkish=1, dovish=0; cpi: hawkish=1, dovish=0",
      },
      evidence_sources: ["fomc_2026_06", "jobs", "cpi", "gdp"],
      meeting_history: [
        {
          label: "June 2026",
          date: "June 17, 2026",
          decision: "hold",
          official_vote: "12-0",
          url: "https://www.federalreserve.gov/newsevents/pressreleases/monetary20260617a.htm",
          summary:
            "The Committee maintained the target range at 3-1/2 to 3-3/4 percent while citing solid activity, strong investment, and inflation pressure tied partly to energy-related supply shocks.",
          dissent_note: "The official statement was approved unanimously.",
          votes: ["hold", "hold", "hold", "hold", "hold", "hold", "hold", "hold", "hold", "hold", "hold", "hold"],
        },
        {
          label: "April 2026",
          date: "April 29, 2026",
          decision: "hold",
          official_vote: "8-4",
          url: "https://www.federalreserve.gov/newsevents/pressreleases/monetary20260429a.htm",
          summary:
            "The Committee held rates steady amid elevated inflation and geopolitical uncertainty, keeping the 3-1/2 to 3-3/4 percent target range in place.",
          dissent_note:
            "One dissenter preferred a 25 bp cut, while three others supported the rate hold but opposed including easing-bias language in the statement.",
          votes: [
            "hold",
            "hold",
            "hold",
            "hold",
            "hold",
            "hold",
            "hold",
            "hold",
            "hold-dissent",
            "hold-dissent",
            "hold-dissent",
            "cut",
          ],
        },
        {
          label: "March 2026",
          date: "March 18, 2026",
          decision: "hold",
          official_vote: "11-1",
          url: "https://www.federalreserve.gov/newsevents/pressreleases/monetary20260318a.htm",
          summary:
            "The Committee maintained the target range at 3-1/2 to 3-3/4 percent and stressed elevated uncertainty alongside still-elevated inflation.",
          dissent_note: "One dissenter preferred a 25 bp cut at the meeting.",
          votes: ["hold", "hold", "hold", "hold", "hold", "hold", "hold", "hold", "hold", "hold", "hold", "cut"],
        },
        {
          label: "January 2026",
          date: "January 28, 2026",
          decision: "hold",
          official_vote: "10-2",
          url: "https://www.federalreserve.gov/newsevents/pressreleases/monetary20260128a.htm",
          summary:
            "The Committee kept rates unchanged at 3-1/2 to 3-3/4 percent, noting solid activity, labor-market stabilization, and still-elevated inflation.",
          dissent_note: "Two dissenters preferred a 25 bp cut at the meeting.",
          votes: ["hold", "hold", "hold", "hold", "hold", "hold", "hold", "hold", "hold", "hold", "cut", "cut"],
        },
      ],
      dashboard: {
        next_meeting_heat_map: [
          { label: "Inflation Pressure", score: 5, tone: "hot", sources: ["fomc_2026_06", "cpi"] },
          { label: "Labor Strength", score: 5, tone: "hot", sources: ["fomc_2026_06", "jobs"] },
          { label: "Growth Momentum", score: 2, tone: "cool", sources: ["jobs", "gdp"] },
          { label: "Policy Bias", score: 4, tone: "warm", sources: ["fomc_2026_06", "cpi", "jobs"] },
        ],
      },
    };

    const fomcOverlay = window.__FOMC_DASHBOARD_DATA__;
    const marketOverlay = window.__MARKET_DASHBOARD_DATA__;
    const normalizeTriplet = (values) => {
      const parsed = {
        raise: Number(values?.raise || 0),
        hold: Number(values?.hold || 0),
        cut: Number(values?.cut || 0),
      };
      const total = parsed.raise + parsed.hold + parsed.cut;
      if (total <= 0) {
        return { raise: 0, hold: 0, cut: 0 };
      }
      return {
        raise: parsed.raise / total,
        hold: parsed.hold / total,
        cut: parsed.cut / total,
      };
    };
    const formatPct = (value) => `${Math.round((value || 0) * 100)}%`;
    const scoreFromProbability = (value) => Math.max(1, Math.min(5, Math.round((value || 0) * 5)));
    const toneFromScore = (score) => {
      if (score >= 5) return "hot";
      if (score === 4) return "warm";
      if (score === 3) return "balanced";
      if (score === 2) return "cool";
      return "cold";
    };

    const marketPrediction = (() => {
      if (!marketOverlay || !marketOverlay.blended_probabilities) return null;
      const blended = normalizeTriplet(marketOverlay.blended_probabilities);
      const ordered = Object.entries(blended).sort((a, b) => b[1] - a[1]);
      const [decision, confidence] = ordered[0];
      const providerNotes = Object.entries(marketOverlay.providers || {}).map(([provider, payload]) => {
        const providerBlend = normalizeTriplet(payload.probabilities || {});
        return `${provider}: R ${formatPct(providerBlend.raise)}, H ${formatPct(providerBlend.hold)}, C ${formatPct(providerBlend.cut)}`;
      });
      return {
        decision,
        confidence,
        rationale:
          `Market blend (${marketOverlay.target_meeting}): ` +
          `R ${formatPct(blended.raise)}, H ${formatPct(blended.hold)}, C ${formatPct(blended.cut)}.` +
          (providerNotes.length ? ` Providers: ${providerNotes.join("; ")}` : ""),
      };
    })();

    const marketHeatCards = (() => {
      if (!marketOverlay || !marketOverlay.blended_probabilities) return [];
      const blended = normalizeTriplet(marketOverlay.blended_probabilities);
      const labels = [
        { key: "raise", title: "Market Raise Odds" },
        { key: "hold", title: "Market Hold Odds" },
        { key: "cut", title: "Market Cut Odds" },
      ];
      const providerNotes = Object.entries(marketOverlay.providers || {}).map(([provider, payload]) => {
        const providerBlend = normalizeTriplet(payload.probabilities || {});
        return { provider, probs: providerBlend };
      });
      return labels.map((item) => {
        const score = scoreFromProbability(blended[item.key]);
        return {
          label: item.title,
          score,
          tone: toneFromScore(score),
          sources: [
            `target ${marketOverlay.target_meeting}`,
            ...providerNotes.map((note) => `${note.provider}: ${formatPct(note.probs[item.key])}`),
          ],
        };
      });
    })();

    const fomcHeatCards = (() => {
      if (!fomcOverlay || !Array.isArray(fomcOverlay.signals) || !fomcOverlay.signals.length) {
        return dashboardData.dashboard.next_meeting_heat_map;
      }
      return fomcOverlay.signals.map((signal) => {
        const score = Math.max(1, Math.min(5, Number(signal?.score || 3)));
        return {
          label: String(signal?.label || "FOMC Signal"),
          score,
          tone: String(signal?.tone || toneFromScore(score)),
          sources: Array.isArray(signal?.sources) ? signal.sources.map((source) => String(source)) : [],
        };
      });
    })();

    const activePrediction = marketPrediction || dashboardData.next_meeting_prediction;
    const combinedHeatMap = [...fomcHeatCards, ...marketHeatCards];

    const nextMeetingDate = marketOverlay?.target_meeting || fomcOverlay?.meeting_date || "N/A";
    document.getElementById("summary").textContent =
      `Mix of parsed FOMC statements, daily market snapshots. Next FOMC Meeting: ${nextMeetingDate}`;
    document.getElementById("prediction-title").textContent =
      `Predicted next move: ${String(activePrediction.decision).toUpperCase()}`;
    document.getElementById("confidence").textContent =
      `${Math.round(Number(activePrediction.confidence || 0) * 100)}% confidence`;
    document.getElementById("rationale").textContent = activePrediction.rationale;

    const sources = document.getElementById("sources");
    const sourceItems = new Set(dashboardData.evidence_sources);
    if (fomcOverlay && fomcOverlay.meeting_date) {
      sourceItems.add(`fomc:${fomcOverlay.meeting_date}`);
    }
    if (marketOverlay) {
      sourceItems.add(`market:${marketOverlay.target_meeting}`);
      Object.keys(marketOverlay.providers || {}).forEach((provider) => sourceItems.add(`market:${provider}`));
    }
    [...sourceItems].forEach((source) => {
      const pill = document.createElement("span");
      pill.className = "source-pill";
      pill.textContent = source;
      sources.appendChild(pill);
    });

    const heatMap = document.getElementById("heat-map");
    combinedHeatMap.forEach((item) => {
      const card = document.createElement("article");
      card.className = `heat-cell heat-${item.tone}`;
      card.innerHTML = `
        <div class="eyebrow">${item.label}</div>
        <div class="heat-score">${item.score}/5</div>
        <div>${item.tone}</div>
        <div class="source-list">${item.sources.map((source) => `<span class="source-pill">${source}</span>`).join("")}</div>
      `;
      heatMap.appendChild(card);
    });

    const voteConfig = {
      hold: { label: "Hold", fillClass: "fill-hold", dotClass: "dot-hold" },
      "hold-dissent": {
        label: "Hold dissent",
        fillClass: "fill-hold-dissent",
        dotClass: "dot-hold-dissent",
      },
      raise: { label: "Raise", fillClass: "fill-raise", dotClass: "dot-raise" },
      cut: { label: "Cut", fillClass: "fill-cut", dotClass: "dot-cut" },
    };
    const voteOrder = ["hold", "hold-dissent", "raise", "cut"];

    const meetingTimeline = document.getElementById("meeting-timeline");
    dashboardData.meeting_history.forEach((meeting) => {
      const counts = voteOrder
        .map((vote) => ({
          vote,
          count: meeting.votes.filter((item) => item === vote).length,
        }))
        .filter((item) => item.count > 0);

      const card = document.createElement("article");
      card.className = "timeline-card";
      card.innerHTML = `
        <div class="timeline-header">
          <div class="timeline-title">
            <div class="eyebrow">${meeting.date}</div>
            <h3>${meeting.label}</h3>
          </div>
          <div class="timeline-links">
            <a class="pill" href="${meeting.url}" target="_blank" rel="noopener noreferrer">FOMC Statement</a>
          </div>
        </div>
        <div class="timeline-stats">
          <span class="pill">Decision: ${meeting.decision.toUpperCase()}</span>
          <span class="source-pill">Official vote: ${meeting.official_vote}</span>
        </div>
        <p class="note">${meeting.summary}</p>
        <p class="note">${meeting.dissent_note}</p>
        <div class="timeline-breakdown">
          ${counts
            .map(
              (item) => `
                <span class="metric-chip">
                  <span class="metric-dot ${voteConfig[item.vote].dotClass}"></span>
                  ${voteConfig[item.vote].label}: ${item.count}
                </span>
              `
            )
            .join("")}
        </div>
        <div class="vote-bar">
          ${counts
            .map(
              (item) => `
                <span
                  class="vote-segment ${voteConfig[item.vote].fillClass}"
                  style="width: ${(item.count / meeting.votes.length) * 100}%"
                ></span>
              `
            )
            .join("")}
        </div>
        <div class="timeline-votes-grid">
          ${meeting.votes
            .map(
              (vote, index) => `
                <article class="voter-card timeline-voter-card" title="${voteConfig[vote].label}" aria-label="${voteConfig[vote].label}">
                  <div class="avatar" aria-hidden="true"></div>
                  <h4>Member ${(index + 1).toString().padStart(2, "0")}</h4>
                  <div class="vote-tag vote-${vote}">${voteConfig[vote].label}</div>
                </article>
              `
            )
            .join("")}
        </div>
      `;
      meetingTimeline.appendChild(card);
    });
  </script>
</body>
</html>
