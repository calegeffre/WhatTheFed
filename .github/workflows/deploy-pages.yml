name: Refresh data and deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "config/**"
      - "scripts/build-static-site.py"
      - "whatthefed/**"
      - ".github/workflows/deploy-pages.yml"
  schedule:
    # Morning refresh for overnight rates and markets, plus a weekday
    # afternoon refresh after Treasury curve publication.
    - cron: "30 15 * * *"
    - cron: "30 23 * * 1-5"
  workflow_dispatch:
    inputs:
      refresh_backtest:
        description: Recalculate the model backtest during this deployment
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build static dashboard
        env:
          REFRESH_BACKTEST: ${{ inputs.refresh_backtest }}
        run: |
          args=()
          if [[ "$REFRESH_BACKTEST" == "true" ]]; then
            args+=(--refresh-backtest)
          fi
          python scripts/build-static-site.py \
            --output-dir _site \
            --history-source-url https://calegeffre.github.io/WhatTheFed/data/model_probability_history_data.js \
            --backtest-source-url https://calegeffre.github.io/WhatTheFed/data/data_backtest_data.js \
            "${args[@]}"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
